name: Verify

# 为什么需要这个工作流：`AGENTS.md` 的硬规则是「无出处，不入仓库」，而出处记录的可查性
# 必须由机器保证。pages.yml 只组装站点，不做任何校验；这里补上校验这一环。
#
# 两条校验互不依赖：
# - verify_provenance.py 只用标准库，任何时候都必须通过；
# - outline_oracle.py --selftest 需要 numpy + Pillow 做光栅化对比（脚本里已按缺库降级）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 定时全库退化扫描：退化候选是「几何启发式命中」，不能自动隔离，
  # 但库会长大——新收的一批件里有没有空框/碎点，得有人定期扫一遍。
  # 放在定时而不是每次 push，是因为全库扫描要几十分钟，每次 push 都跑不现实。
  schedule:
    - cron: '23 4 * * 1'   # 每周一 04:23 UTC

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  provenance:
    name: 校验出处记录
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: provenance 与文件 sha256 对账
        run: python src/verify_provenance.py --quiet

  outline:
    name: 轮廓层几何自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装光栅化依赖
        run: python -m pip install --quiet --disable-pip-version-check numpy Pillow
      - name: 轮廓几何自检
        run: python src/outline_oracle.py --selftest

  glyphs:
    name: 字形体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 体检守的是「本库只收矢量字形」这条规则：汉典个别实例是 base64 PNG 套壳，
      # 清洗时已剔除，这里再查一遍，防止以后有字形绕过清洗直接入库。
      # 只体检仓里真有的层（`glyphs/*/` 里有 index.csv 的）：写死层名的话，
      # 本地有一层没发就会让 CI 直接红，而「红」会被当成代码坏了，反而遮蔽真问题。
      - name: 逐层体检（XML 合法、viewBox、路径 bbox、退化检测）
        run: |
          for d in glyphs/*/; do
            [ -f "$d/index.csv" ] || continue
            python src/check_glyphs.py "$d"
          done
      # 位图描摹件的保真核验：本地 SVG 回光栅化后与上游位图的 IoU，
      # 按**单条 ≥ 0.97 / 层级 p05 ≥ 0.96 / 失败率 ≤ 1%** 三道门槛判。
      # 只读 provenance 里记的 trace_iou，不用重跑光栅化，标准库即可。
      - name: 描摹保真核验
        run: python src/check_glyphs.py --trace-fidelity

  fontlicenses:
    name: 字体层许可正文核验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 楷/行/草/宋/宋繁/黑体·港六层是 OFL 派生的：**正文必须与 SIL 官方 OFL 1.1 逐条款相同**，
      # 否则不能标 OFL-1.1 入库（開元小篆就是反例，见 THIRD_PARTY_NOTICES.md）。
      # 这一步顺带报出有没有声明保留字体名（RFN）。
      #
      # 这里**没有**加 --font：那个参数要读字体二进制的 name 表，
      # 而字体原件（十几到几十 MB）不在仓库里。name 表那一侧的 RFN 结论
      # 记在各层的 SOURCE.md 与 THIRD_PARTY_NOTICES.md 里，收字体时人工核过。
      - name: 逐条款比对上游 OFL.txt 与官方原文
        run: |
          for d in glyphs/*/; do
            [ -f "$d/OFL.txt" ] || continue
            python src/verify_font_licenses.py --license-dir "$d"
          done

  licenseaudit:
    name: 发布安全审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 守的是「发布前必须随附的东西都在」这条规则：
      # 每条记录都要有 attribution 与改动说明；OFL 层要随附许可全文且正文与官方原文
      # 逐条款相同；每一层都要在 THIRD_PARTY_NOTICES.md 里有署名段。
      # 只用标准库，不依赖字体原件。
      - name: 逐层核验随附义务是否已履行
        run: python src/license_audit.py --check

  songtivariants:
    name: 宋体两层的性质核验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 守的是「宋体·简 / 宋体·繁 是**地区变体**，不是字符集筛选」这条事实：
      # 简体层装的是整个 CJK 基本区，所以常用繁体专属字与对应的简体字**都必须在**。
      # 少了就说明这层被当成了「简体字集合」——那正是要防住的误解。
      # 只读两个 index.csv，不用字体原件，秒级。
      - name: 核验两层的字符集事实
        run: python src/verify_songti_variants.py --charset-only

  layerrules:
    name: 层的规则与不变量体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布锚点要跟 **git tag 下那份账本**对账（ledger_sha256 + 该 tag 的已发布号
          # 集合指纹），所以必须拿得到 tag **和它指向的那棵树**。
          #
          # 为什么是 fetch-depth: 0 而不是 fetch-tags: true —— 读过 checkout v4 的源码
          # （git-source-provider.ts / git-command-manager.ts / ref-helper.ts）：
          # · fetch-depth: 0 走 getRefSpecForAllHistory()，refspec 里含
          #   '+refs/tags/*:refs/tags/*' → **全部 tag 连同其对象**都取回来；
          # · fetch-tags: true 只是**不加** '--no-tags'，走 git 默认的「自动跟随」——
          #   只跟随**指向被取回那段历史**的 tag。浅层（depth=1）下历史只有一个 commit，
          #   所以 tag 落在更早的 commit 上时就**取不到**，那条对账会静默跳过。
          # 代价是拉全史（.git 约 480 MB）；工作树本身就有 1.1 GB，比例上可接受。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 守的是层**自己的规矩**（verify_provenance.py 管出处、check_glyphs.py 管 SVG 合不合法，
      # 两者都不管这一层）：
      # ① 规则统一——分桶维度与每字上限与 build_xxt_manifest.LAYER_RULES 一致；
      # ② 无重复字——「(现代字, 字形键)」唯一；
      # ③ 字正确——unicode 必须等于 modern_char 的码位，私用區码位不得当汉字码位；
      # ④ 相关信息更新正确——index.csv 与 provenance 逐条对得上。
      # 只用标准库。
      - name: 逐层体检规则与不变量
        run: python src/check_layer_rules.py --repo-root .
      # 文档里的层件数与层里实际件数对账：层的规模一变，README 顶层层表
      # 的数字就得跟着改，漏改的数字比没有数字更坏（读者会拿它当依据）。
      # 只认 README 顶层层表那种固定写法（`| `glyphs/层/` | **N** 个字形 |`），
      # 免得把子集数、分批数、合计数误判成层规模。
      - name: 文档层件数对账
        run: python src/check_doc_numbers.py --repo-root .
      # 统一编号账本：① 账本合并复算与仓内文件逐字节一致——ID 铸发后冻结，
      # index 改动只允许走「新增 max+1 / 退役」，任何重排在这里红；
      # ② 冻结政策自检（插入 max+1 / 退役保留 / 退役号不复用 / 同键复活）；
      # ③ 发布锚点对账——已发布号集合指纹 + 该 release 的 tag 下账本哈希。
      - name: 统一编号账本校验
        run: |
          python src/build_glyph_ids.py --selftest
          python src/build_glyph_ids.py --check

  rubbing:
    name: 拓片反转变体核验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 反转变体是**派生层**：它的每一个文件都得能由当前算法重跑出来。
      # 这条检查守三件事：
      # ① 逐件报告里的判定与目录里的文件一一对应（不多、不少）；
      # ② 重跑一遍算法，判定不变（改了门槛却没重跑转换，这里会红）；
      # ③ 重跑出来的文件与仓库里的**逐字节相同**（算法改了、转换没重跑，这里会红）。
      # 光栅化要 numpy + Pillow。
      - name: 安装光栅化依赖
        run: python -m pip install --quiet --disable-pip-version-check numpy Pillow
      - name: 复核反转变体层
        run: python src/invert_rubbing_glyphs.py --repo-root . --mode check --recheck

  xxtpending:
    name: 小學堂批次待补清单体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 待补清单记的是「计划要收、但上游位图取不到」的字形。
      # 清单里若有字形**已经在层里**，说明清单过期了——上游一旦恢复、字形补进来，
      # 就该把它从清单里划掉。这条检查只读仓内文件，不用 tmp/，也不用联网。
      - name: 逐层体检待补清单
        run: python src/xxt_pending.py --check --repo-root .

  ids_v2:
    name: v2.2-min ID 规范自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 本 job 跑的是 build_ids.py（v2.2-min 的 GID 工具链），**不跑**
        # build_glyph_ids.py --check，也不碰 git 对象——所以这里不需要取 tag，
        # 保持浅层即可。若将来把统一编号账本校验挪到这个 job，必须同时改成
        # fetch-depth: 0（浅层取不到旧 tag，发布锚点那条对账会静默跳过）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 人工裁决文件**必须入库**。
      #
      # 为什么不用 `build_ids.py --scaffold` 来「确保它们存在」：
      # scaffold 只能补缺失的文件，一旦文件缺失它会**重建**一份初始内容——
      # 那样 CI 就分不清「人在库里裁决过」和「库里压根没有这份裁决」，
      # 于是「裁决文件没入库」这种最该红的情况被 scaffold 悄悄抹平。
      # 所以这里断言文件**在仓里且已被 git 跟踪**，不重建。
      - name: 人工裁决文件在场（由人维护，代码不得重建）
        run: |
          for f in glyphs/ids/quarantine.csv glyphs/ids/mint-adjudications.csv; do
            [ -f "$f" ] || { echo "::error file=$f::缺少人工裁决文件"; exit 1; }
            git ls-files --error-unmatch -- "$f" >/dev/null 2>&1 \
              || { echo "::error file=$f::人工裁决文件未入库（代码不得重建，须由人提交）"; exit 1; }
          done
      - name: ID 自检与账本检查
        run: |
          python src/build_ids.py --selftest
          python src/build_ids.py --check
          python src/build_ids.py --full-mint
          python src/build_ids.py --report
      # 铸发计划数对账：v1 账本**未变**时，计划数必须与基线逐项相同。
      # 计数变了而文件一个没动 = 折叠/隔离语义被悄悄改了（v1 变了则只提示重新基线）。
      - name: 铸发计划数对账
        run: python src/build_ids.py --check-plan
      # 快照自洽：重算发布清单（账本 + provenance + 全部 active 字形文件）并与 meta 比对。
      # 清单本身是发布归档物、不进版本库，所以这里比的是**重算值**。
      - name: 快照自洽核验
        run: python src/build_ids.py --snapshot-verify
      - name: 退化候选快速路径（确认清单 + 反例）
        run: |
          python src/build_ids.py --census-verify
          python src/check_glyphs.py --degenerate-candidates --limit 0 --require-counterexample

  degenerate_scan:
    name: 全库退化候选扫描（定时）
    runs-on: ubuntu-latest
    # 每周一次的全库扫描，扫完只**报告**、不自动隔离：
    # 命中不等于退化（heiti-hk/005341.svg 就是反例），隔离是人的裁决。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 全库几何扫描（几十分钟量级，所以只在定时任务里跑）。
      - name: 全库几何退化候选扫描
        run: python src/build_ids.py --census
      # 候选清单与人工确认清单对账（快）：确认清单里每一件都得是真候选，
      # 而反例 heiti-hk/005341.svg 绝不能被隔离。
      - name: 候选清单与人工确认清单对账
        run: python src/build_ids.py --census-verify
      # 候选清单作为工件留档，供策展人逐条看、逐条裁决（写进 quarantine.csv）。
      - name: 上传候选清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-candidates
          path: glyphs/ids/quarantine-candidates.csv
          if-no-files-found: ignore
